name: Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Custom release tag (e.g. v1.0.0+10). Leave empty to use auto-incremented build number."
        required: false
        default: ""
      is_draft:
        description: "Create draft release"
        type: boolean
        default: false
      is_prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine Dynamic Version and Build Number
        id: versioning
        run: |
          # Read base semantic version and base build number from version.properties
          if [ -f version.properties ]; then
            APP_VERSION=$(grep '^VERSION_NAME=' version.properties | cut -d '=' -f 2 | tr -d '\r')
            BUILD_OFFSET=$(grep '^VERSION_CODE=' version.properties | cut -d '=' -f 2 | tr -d '\r')
          else
            APP_VERSION="1.0.0"
            BUILD_OFFSET=1
          fi

          # Fallbacks if fields are empty
          APP_VERSION=${APP_VERSION:-1.0.0}
          BUILD_OFFSET=${BUILD_OFFSET:-1}

          # Auto-increment build number using GitHub run_number
          BUILD_NUMBER=$(( BUILD_OFFSET + ${{ github.run_number }} ))

          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="v${APP_VERSION}+${BUILD_NUMBER}"
          fi

          RELEASE_TITLE="Crop Disease Detection v${APP_VERSION} (Build ${BUILD_NUMBER})"

          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "release_title=$RELEASE_TITLE" >> $GITHUB_OUTPUT
          echo "Configured Version: $APP_VERSION, Dynamic Build Number: $BUILD_NUMBER, Tag: $TAG"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Restore Secrets and Signing Configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        run: |
          mkdir -p secrets

          # Decode Google Services JSON
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "Successfully restored app/google-services.json."
          else
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is missing!"
            exit 1
          fi

          # Decode local.properties
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            echo "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            echo "Successfully restored local.properties."
          else
            echo "::error::LOCAL_PROPERTIES_BASE64 secret is missing!"
            exit 1
          fi

          # Decode Keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > secrets/release.keystore
            echo "Successfully restored release keystore."
          else
            echo "::error::KEYSTORE_BASE64 secret is missing!"
            exit 1
          fi

          # Write keystore.properties for Android Gradle
          printf "KEYSTORE_PATH=secrets/release.keystore\nKEYSTORE_PASSWORD=%s\nKEY_ALIAS=%s\nKEY_PASSWORD=%s\n" \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > secrets/keystore.properties
          echo "Successfully generated secrets/keystore.properties."

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: secrets/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PappVersionCode="${{ steps.versioning.outputs.build_number }}" \
            -PappVersionName="${{ steps.versioning.outputs.app_version }}" \
            --no-daemon \
            --stacktrace

      - name: Prepare Release Artifacts and Checksums
        run: |
          mkdir -p release_assets

          # Copy Release APK
          cp app/build/outputs/apk/release/app-release.apk "release_assets/crop-disease-detection-v${{ steps.versioning.outputs.app_version }}+${{ steps.versioning.outputs.build_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release_assets/crop-disease-detection-release.apk"

          # Generate SHA256 checksums
          cd release_assets
          sha256sum *.apk > SHA256SUMS.txt
          cd ..

          echo "Generated release assets:"
          ls -lh release_assets/

      - name: Create GitHub Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: ${{ steps.versioning.outputs.release_title }}
          files: |
            release_assets/*.apk
            release_assets/SHA256SUMS.txt
          draft: ${{ github.event.inputs.is_draft || false }}
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
